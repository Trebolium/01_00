[project]
name = "olympia"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.2.8",
    "groq>=1.7.0",
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
    "openai>=3.20.0",
    "openwakeword>=0.6.0",
    "python-dotenv>=1.2.3",
    "scipy>=1.17.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olympia"]
